<section class="section fade-up">
  <div class="container">
    <div class="contact-grid">

      <!-- Info cards -->
      <div class="info-cards">
        <div class="info-card">
          <div class="info-card-icon">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 1C7.4 1 4.5 4.3 4.5 6.5 4.5 11 11 21 11 21s6.5-10 6.5-14.5C17.5 4.3 14.6 1 11 1z"/><circle cx="11" cy="7" r="2"/></svg>
          </div>
          <div class="info-card-content">
            <label>Address</label>
            <a href="https://maps.app.goo.gl/w7VkGrbsxoPVcA1N8" target="_blank" rel="noopener">Unit 115/193 S Pine Road, Brendale QLD 4500</a>
          </div>
        </div>
        <div class="info-card">
          <div class="info-card-icon">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5.5l8 5.5 8-5.5M3 5.5h16v12H3z"/></svg>
          </div>
          <div class="info-card-content">
            <label>Email Us</label>
            <a href="mailto:admin@weatherproof.net.au">admin@weatherproof.net.au</a>
          </div>
        </div>
        <div class="info-card">
          <div class="info-card-icon">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8.4 3.7l-2.7 2.7a1.3 1.3 0 00-.3 1.2c.7 2.4 2.2 4.6 4 6.4s4 3.3 6.4 4a1.3 1.3 0 001.2-.3l2.7-2.7a.7.7 0 000-1l-3.1-3a.7.7 0 00-1 0l-1.3 1.3a.4.4 0 01-.5 0C12.2 11.2 10.6 9.6 9.4 8a.4.4 0 010-.5l1.3-1.3a.7.7 0 000-1l-3-3.1a.7.7 0 00-1 0z"/></svg>
          </div>
          <div class="info-card-content">
            <label>Call Us</label>
            <a href="tel:0720000041">(07) 2000 0041</a>
          </div>
        </div>
      </div>

      <!-- Contact form -->
      <div class="contact-form-card">
        <h3>Send Us a Message</h3>
        <p class="sub">Fill out the form below and we'll get back to you within 24 hours.</p>
        <form class="quote-form" onsubmit="event.preventDefault(); this.querySelector('.btn').textContent='Sent — Thank you!'; this.querySelector('.btn').style.background='var(--success)';">
          <label class="form-field">
            <span class="form-label">First name <span class="required-mark" aria-label="required">*</span></span>
            <input type="text" name="first-name" autocomplete="given-name" required>
          </label>
          <label class="form-field">
            <span class="form-label">Last name <span class="required-mark" aria-label="required">*</span></span>
            <input type="text" name="last-name" autocomplete="family-name" required>
          </label>
          <label class="form-field">
            <span class="form-label">Email <span class="required-mark" aria-label="required">*</span></span>
            <input type="email" name="email" autocomplete="email" required>
          </label>
          <label class="form-field">
            <span class="form-label">Phone number</span>
            <input type="tel" name="phone" autocomplete="tel">
          </label>
          <label class="form-field">
            <span class="form-label">Suburb</span>
            <input type="text" name="suburb" autocomplete="address-level2">
          </label>
          <label class="form-field">
            <span class="form-label">Service</span>
            <select name="service">
              <option value="" selected>What service are you looking for?</option>
              <option>Roof Cleaning</option>
              <option>Roof Painting</option>
              <option>Roof Repair</option>
              <option>Roof Restoration</option>
            </select>
          </label>
          <label class="form-field full-width">
            <span class="form-label">Message</span>
            <textarea name="message"></textarea>
          </label>
          <button type="submit" class="btn btn--primary full-width">Send Message</button>
        </form>
      </div>

    </div>
  </div>
</section>
