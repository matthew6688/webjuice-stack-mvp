<section class="faq-section">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">FAQ</p>
      <h2 class="section-h2">Common questions, answered straight</h2>
    </div>
    <div class="faq-list">
      {{#faqs}}
      <details class="faq-item">
        <summary class="faq-q">{{q}}</summary>
        <div class="faq-a">{{a}}</div>
      </details>
      {{/faqs}}
    </div>
    <div class="faq-cta">
      <p>Got a different question?</p>
      <a href="{{tel_link}}" class="btn-primary">Call {{phone}}</a>
    </div>
  </div>
</section>
<style>
.faq-section { padding: clamp(64px, 9vw, 120px) 0; background: var(--surface); }
.faq-list { max-width: 820px; margin: 0 auto; }
.faq-item { border-top: 1px solid var(--border); padding: 0; }
.faq-item:last-child { border-bottom: 1px solid var(--border); }
.faq-q { padding: 24px 0; cursor: pointer; font-family: var(--font-display); font-size: 18px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.faq-q::after { content: '+'; color: var(--brand-accent); font-size: 24px; font-weight: 400; transition: transform 0.2s; }
.faq-item[open] .faq-q::after { content: '−'; }
.faq-q::-webkit-details-marker { display: none; }
.faq-a { padding: 0 0 24px; font-size: 16px; line-height: 1.7; color: var(--text-muted); max-width: 65ch; }
.faq-cta { text-align: center; margin-top: 56px; }
.faq-cta p { color: var(--text-muted); margin: 0 0 16px; font-size: 16px; }
</style>
