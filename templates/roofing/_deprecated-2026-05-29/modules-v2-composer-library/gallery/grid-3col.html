<section class="gallery-section">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">Recent projects</p>
      <h2 class="section-h2">Real {{city}} roofs · not stock photos</h2>
    </div>
    <div class="gallery-grid">
      {{#gallery}}
      <figure class="gallery-item">
        <img src="{{src}}" alt="{{alt}}" loading="lazy" />
      </figure>
      {{/gallery}}
      {{^gallery}}
      <figure class="gallery-item"><img src="{{template_assets}}/gallery/img-01.png" alt="Aerial Colorbond Trimdek roof" loading="lazy" /></figure>
      <figure class="gallery-item"><img src="{{template_assets}}/gallery/img-02.png" alt="Colorbond ridge capping detail" loading="lazy" /></figure>
      <figure class="gallery-item"><img src="{{template_assets}}/gallery/img-03.png" alt="Heritage weatherboard with Colorbond roof" loading="lazy" /></figure>
      <figure class="gallery-item"><img src="{{template_assets}}/gallery/img-04.png" alt="Roofer installing Colorbond at sunset" loading="lazy" /></figure>
      {{/gallery}}
    </div>
    <div class="gallery-cta">
      <a href="#lead-form" class="btn-secondary">Get a quote for your project</a>
    </div>
  </div>
</section>
<style>
.gallery-section { padding: clamp(64px, 9vw, 120px) 0; background: var(--surface-muted); }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.gallery-item { margin: 0; aspect-ratio: 4/3; overflow: hidden; border-radius: 2px; }
.gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
.gallery-item:hover img { transform: scale(1.03); }
.gallery-cta { text-align: center; margin-top: 48px; }
</style>
