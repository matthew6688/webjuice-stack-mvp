<section class="process-section">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">How we work</p>
      <h2 class="section-h2">Four steps. No surprises.</h2>
      <p class="section-lead">From first phone call to warranty handover, you know what's next.</p>
    </div>
    <ol class="process-list">
      {{#process}}
      <li class="process-step">
        <div class="process-step-num">{{step}}</div>
        <h3 class="process-step-title">{{title}}</h3>
        <p class="process-step-body">{{body}}</p>
      </li>
      {{/process}}
    </ol>
  </div>
</section>
<style>
.process-section { padding: clamp(64px, 9vw, 120px) 0; background: var(--surface); }
.process-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 32px; padding: 0; margin: 0; list-style: none; counter-reset: process-counter; }
.process-step { position: relative; padding-top: 32px; }
.process-step-num { font-family: var(--font-display); font-size: 56px; font-weight: 700; color: var(--brand-accent); line-height: 1; margin-bottom: 12px; }
.process-step-title { font-family: var(--font-display); font-size: 20px; margin: 0 0 12px; font-weight: 700; }
.process-step-body { font-size: 15px; line-height: 1.6; color: var(--text-muted); margin: 0; }
</style>
