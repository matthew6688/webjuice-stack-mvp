<section class="stats-band">
  <div class="container stats-band-inner">
    <div class="stats-item">
      <div class="stats-num">{{years_in_business}}+</div>
      <div class="stats-label">Years working {{city}} roofs</div>
    </div>
    <div class="stats-item">
      <div class="stats-num">{{warranty_years}}<span class="stats-num-unit">yr</span></div>
      <div class="stats-label">Workmanship warranty</div>
    </div>
    <div class="stats-item">
      <div class="stats-num">{{rating}}<span class="stats-num-unit">★</span></div>
      <div class="stats-label">{{review_count}} Google reviews</div>
    </div>
    <div class="stats-item">
      <div class="stats-num">100<span class="stats-num-unit">km</span></div>
      <div class="stats-label">Service radius from {{city}}</div>
    </div>
  </div>
</section>
<style>
.stats-band { padding: clamp(48px, 7vw, 88px) 0; background: var(--brand-primary); color: #fff; }
.stats-band-inner { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 32px; }
.stats-item { text-align: center; padding: 16px 8px; }
.stats-num { font-family: var(--font-display); font-size: clamp(48px, 6vw, 80px); line-height: 0.95; font-weight: 700; color: var(--brand-accent); letter-spacing: -0.02em; }
.stats-num-unit { font-size: 0.5em; color: rgba(255,255,255,0.8); margin-left: 4px; font-weight: 500; }
.stats-label { font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 8px; font-weight: 600; letter-spacing: 0.04em; max-width: 18ch; margin-inline: auto; }
</style>
