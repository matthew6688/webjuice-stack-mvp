<!-- sticky-mobile-bar · phone-cta-pair · mobile-only fixed bottom bar -->
<aside class="sticky-mobile-bar" aria-label="Quick contact">
  <a href="{{tel_link}}" class="smb-btn smb-btn-call" aria-label="Call {{phone}}">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M6.2 2.7l-2 2a1 1 0 00-.2.9c.5 1.8 1.6 3.4 3 4.8s3 2.5 4.8 3a1 1 0 00.9-.2l2-2a.5.5 0 000-.7l-2.3-2.3a.5.5 0 00-.7 0l-1 1a.3.3 0 01-.4 0C9 8.3 7.7 7 6.5 5.8a.3.3 0 010-.4l1-1a.5.5 0 000-.7L5.3 1.4a.5.5 0 00-.7 0z"/>
    </svg>
    <span>Call {{phone}}</span>
  </a>
  <a href="#quote" class="smb-btn smb-btn-quote" aria-label="Get a free quote">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M3 3h10v8H7l-3 3v-3H3z"/>
    </svg>
    <span>Get a Quote</span>
  </a>
</aside>

<style>
.sticky-mobile-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 80;
  display: none;
  gap: 8px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: color-mix(in oklab, var(--brand-primary, #0F1115), transparent 8%);
  border-top: 1px solid color-mix(in oklab, var(--brand-accent, #C89C5C), transparent 70%);
  box-shadow: 0 -8px 24px rgba(0,0,0,0.18);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .2s ease, transform .2s ease;
}
.sticky-mobile-bar.is-visible {
  opacity: 1;
  transform: translateY(0);
}
.sticky-mobile-bar .smb-btn {
  flex: 1 1 0;
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 14px;
  border-radius: 10px;
  font-family: var(--font-display, 'Inter Tight', system-ui, sans-serif);
  font-weight: 700;
  font-size: 15px;
  line-height: 1;
  letter-spacing: -0.01em;
  text-decoration: none;
  white-space: nowrap;
}
.sticky-mobile-bar .smb-btn-call {
  background: var(--brand-accent, #C89C5C);
  color: var(--surface, #FFFFFF);
}
.sticky-mobile-bar .smb-btn-call:hover { filter: brightness(1.05); }
.sticky-mobile-bar .smb-btn-quote {
  background: transparent;
  color: var(--surface, #FFFFFF);
  border: 1.5px solid color-mix(in oklab, var(--surface, #FFFFFF), transparent 30%);
}
.sticky-mobile-bar .smb-btn-quote:hover {
  border-color: var(--surface, #FFFFFF);
}

@media (max-width: 720px) {
  .sticky-mobile-bar { display: flex; }
  body { padding-bottom: 72px; }
}
</style>

<script>
(function(){
  var bar = document.currentScript && document.currentScript.previousElementSibling;
  // walk back to the actual aside (currentScript.previousElementSibling is <style>)
  while (bar && !bar.classList?.contains('sticky-mobile-bar')) bar = bar.previousElementSibling;
  if (!bar) return;
  function update(){
    if (window.scrollY > 200) bar.classList.add('is-visible');
    else bar.classList.remove('is-visible');
  }
  update();
  window.addEventListener('scroll', update, { passive: true });
})();
</script>
